<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b18"><meta name="description" content="Your account | JIKZO Creative"><link rel="icon" href="favicon.svg"><title>Your account | JIKZO Creative</title><style>:root{color-scheme:dark;--bg:#070b18;--panel:#101a30;--line:#ffffff20;--text:#f5f8ff;--muted:#a6b3ca;--blue:#2476ff;--cyan:#42dcff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#17345d,transparent 40%),var(--bg);color:var(--text);font:16px/1.65 system-ui,sans-serif}a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit}.wrap{width:min(1120px,calc(100% - 32px));margin:auto}.nav{display:flex;align-items:center;justify-content:space-between;gap:15px;min-height:76px;border-bottom:1px solid var(--line);flex-wrap:wrap}.brand{font-weight:950;letter-spacing:.04em;font-size:1.15rem}.brand span,.gradient{color:var(--cyan)}.links{display:flex;gap:15px;flex-wrap:wrap;align-items:center}.links a{color:#d4e1f6;font-size:.9rem}.links a:hover{color:var(--cyan)}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:999px;padding:10px 17px;background:#ffffff08;color:white;cursor:pointer;font-weight:750}.primary{background:linear-gradient(110deg,#2476ff,#20b9e9);border:0}.hero{padding:62px 0 30px}.kicker{color:var(--cyan);font-size:.76rem;font-weight:850;letter-spacing:.16em;text-transform:uppercase}.hero h1{font-size:clamp(2.5rem,7vw,4.8rem);line-height:1.04;letter-spacing:-.05em;margin:12px 0}.hero p,.muted{color:var(--muted)}.hero p{max-width:720px}.section{padding:22px 0 58px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card,.panel{border:1px solid var(--line);border-radius:20px;overflow:hidden;background:linear-gradient(145deg,#15213a,#0c1427)}.card img{width:100%;height:190px;object-fit:cover}.card-body{padding:20px}.card h2,.card h3{margin:0 0 8px}.card p{color:var(--muted)}.panel{padding:22px;margin:16px 0}.panel h2{margin-top:0}.field{display:grid;gap:6px;margin:12px 0}.field label{color:#cbd7eb;font-size:.9rem}.field input,.field textarea,.field select,input,textarea,select{background:#080f20;border:1px solid var(--line);border-radius:12px;padding:12px;color:white;width:100%}.field textarea{min-height:125px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.status{min-height:24px;color:var(--cyan)}.item{padding:15px;border:1px solid var(--line);border-radius:14px;margin:12px 0;background:#ffffff08}.item p{color:var(--muted)}.hidden{display:none!important}.faq{border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}.faq button{width:100%;text-align:left;padding:17px;background:#ffffff08;color:white;border:0;cursor:pointer;font-weight:750}.faq p{padding:0 17px 16px;color:var(--muted)}footer{border-top:1px solid var(--line);padding:25px 0;color:var(--muted);margin-top:40px}footer a{margin-right:12px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.links{gap:10px}}@media(max-width:560px){.grid{grid-template-columns:1fr}.nav{padding:14px 0;align-items:flex-start;flex-direction:column}.links{width:100%;gap:12px}.hero{padding-top:42px}}</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html">JIKZO <span>Creative</span></a><nav class="links" aria-label="Main navigation"><a href="index.html">Home</a><a href="marketplace.html">Marketplace</a><a href="packages.html">Packages</a><a href="about.html">About</a><a href="portfolio.html">Explore</a><a href="reviews.html">Reviews</a><a href="faq.html">FAQs</a><a href="contact.html">Contact</a><a href="account.html">Account</a></nav></div></header><main class="wrap"><section class="hero"><div class="kicker">Customer account</div><h1>Your projects, <span class="gradient">in one place.</span></h1><p>Sign in to submit project requests and track updates from JIKZO Creative.</p></section><section class="section"><div class="panel" id="authPanel"><div class="row"><button class="btn primary" id="loginMode">Log in</button><button class="btn" id="signupMode">Create account</button></div><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn primary" id="emailAuth">Log in</button><button class="btn" id="googleAuth">Continue with Google</button><p class="status" id="authStatus"></p></div><div class="panel hidden" id="accountPanel"><div class="row"><h2 id="welcome"></h2><button class="btn" id="logout">Sign out</button></div><h3>My project requests</h3><div id="orders">Loading…</div></div></section></main><footer><div class="wrap">© <span class="year"></span> JIKZO Creative · <a href="privacy.html">Privacy</a><a href="terms.html">Terms</a><a href="admin.html">Admin</a></div></footer><script>document.querySelectorAll(".year").forEach(x=>x.textContent=new Date().getFullYear())</script><script type="module">
const status=document.getElementById("authStatus");
const setStatus=(message)=>{status.textContent=message};
setStatus("Connecting securely…");
try {
  const {createClient}=await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
  const db=createClient("https://ylniprnidsrmnicjzayx.supabase.co","sb_publishable_-apNA9fIkidukkp4Xz5Anw_aryBl5gI");
  let mode="login";
  const $=id=>document.getElementById(id);
  const safe=v=>String(v??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  function setMode(m){mode=m;$("emailAuth").textContent=m==="login"?"Log in":"Create account";setStatus("")}
  $("loginMode").addEventListener("click",()=>setMode("login"));
  $("signupMode").addEventListener("click",()=>setMode("signup"));
  $("emailAuth").addEventListener("click",async()=>{
    const email=$("email").value.trim(),password=$("password").value;
    if(!email||password.length<6){setStatus("Enter a valid email and a password of at least 6 characters.");return}
    $("emailAuth").disabled=true;setStatus("Please wait…");
    try {
      const result=mode==="login"?await db.auth.signInWithPassword({email,password}):await db.auth.signUp({email,password,options:{emailRedirectTo:location.href}});
      if(result.error) setStatus(result.error.message);
      else setStatus(mode==="signup"?"Account created. Check your email if confirmation is enabled.":"Login successful. Loading your account…");
    } catch(error){setStatus("Login failed: "+(error?.message||"Please try again."))}
    finally{$("emailAuth").disabled=false}
  });
  $("googleAuth").addEventListener("click",async()=>{
    setStatus("Connecting to Google…");
    try{const {error}=await db.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.href}});if(error)setStatus(error.message)}
    catch(error){setStatus(error?.message||"Google sign-in could not start.")}
  });
  $("logout").addEventListener("click",()=>db.auth.signOut());
  async function refresh(u){
    $("authPanel").classList.toggle("hidden",!!u);$("accountPanel").classList.toggle("hidden",!u);
    if(!u)return;
    $("welcome").textContent="Signed in as "+u.email;
    const {data,error}=await db.from("orders").select("service,brief,status,created_at,admin_note").eq("user_id",u.id).order("created_at",{ascending:false});
    $("orders").innerHTML=error?safe(error.message):data?.length?data.map(o=>'<article class="item"><b>'+safe(o.service)+' · '+safe(o.status)+'</b><p>'+safe(o.brief)+'</p><small>'+new Date(o.created_at).toLocaleString()+'</small>'+(o.admin_note?'<p>JIKZO update: '+safe(o.admin_note)+'</p>':'')+'</article>').join(""):"No project requests yet. Browse the <a href='marketplace.html'>Marketplace</a> to get started.";
  }
  db.auth.onAuthStateChange((_event,session)=>{refresh(session?.user||null).catch(e=>{if($("orders"))$("orders").textContent=e.message})});
  const {data,error}=await db.auth.getSession();
  if(error)throw error;
  await refresh(data.session?.user||null);
  setStatus("");
} catch(error) {
  setStatus("Login service couldn't load: "+(error?.message||"Check your internet connection and reload this page."));
}
</script></body></html>
